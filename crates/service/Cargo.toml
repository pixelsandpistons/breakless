[package]
name = "breakless"
description = "Live Twitch channels with no advert breaks, as HLS playlists for any player. The service."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "breakless"
path = "src/lib.rs"

[[bin]]
name = "breakless"
path = "src/main.rs"

[dependencies]
breakless-formats = { path = "../formats", version = "0.1.0" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }
# ring, not aws-lc-rs: no cmake in the build image. Installed as the process default in main.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The chat connection: the same TLS stack and the same trust roots reqwest uses.
tokio-rustls = { version = "0.26", default-features = false }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }

[dev-dependencies]
fake-twitch = { path = "../fake-twitch", version = "0.1.0" }

[lints]
workspace = true
