[package]
name = "breakless-tools"
description = "Measuring Twitch's adverts: probe, soak, watch-raw, capture, upstream."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "breakless-tools"
path = "src/main.rs"

[dependencies]
breakless = { path = "../service", version = "0.1.0" }
breakless-formats = { path = "../formats", version = "0.1.0" }
clap = { version = "4", features = ["derive", "env"] }
jiff = { version = "=0.2.24", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
regex = "=1.12.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }
serde = "1"
serde_json = "1"
sha2 = "=0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
