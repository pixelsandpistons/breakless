# On a `v*` tag: static binaries for x86_64 and aarch64 Linux, the image on GHCR for both, the
# checksums, and a GitHub release whose notes are the matching CHANGELOG.md section.
#
# Each architecture builds on its own runner (ubuntu-latest is x86_64, ubuntu-24.04-arm is
# aarch64), so nothing is cross-compiled or emulated: Alpine's Rust image on an arm64 runner is an
# arm64 build. The two single-architecture images are pushed by digest and joined into one tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/breakless

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml) and the musl target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p breakless -p breakless-tools
      - name: Checksums
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/breakless dist/breakless-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/breakless-tools dist/breakless-tools-${{ matrix.target }}
          cd dist && sha256sum breakless-${{ matrix.target }} breakless-tools-${{ matrix.target }} > SHA256SUMS-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image for this architecture, by digest
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest
        run: |
          mkdir -p digests
          echo "${{ steps.image.outputs.digest }}" > "digests/${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}
          path: digests/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures, and latest
        run: |
          version="${GITHUB_REF_NAME#v}"
          refs=""
          for d in digests/*; do refs="$refs $IMAGE@$(cat "$d")"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" $refs
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { on = ($2 == v || $2 == "[" v "]") }
            on && !/^## / { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md section for $version" > notes.md; fi
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
