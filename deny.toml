[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0"]

[licenses.private]
ignore = true

# Our own crates. Dependencies stay on the permissive list above.
[[licenses.exceptions]]
name = "breakless"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "breakless-formats"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "breakless-tools"
allow = ["AGPL-3.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # the workspace crates depend on each other by path

[sources]
unknown-registry = "deny"
unknown-git = "deny"
